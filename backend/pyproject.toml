[project]
name = "vigil"
version = "0.1.0"
description = "Vigil — personal equity research and alert platform (research support only; no brokerage connectivity)"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "typer>=0.12",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
llm = ["anthropic>=0.34"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-python-dateutil",
]

[project.scripts]
vigil = "vigil.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:apscheduler.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003 allow deliberate typography (–, ×, −, ✓) in user-facing strings.
ignore = ["E501", "SIM108", "SIM105", "B008", "RUF012", "RUF001", "RUF002", "RUF003", "UP042"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["vigil"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false

# The synthetic universe table splats shared market kwargs (**US / **UK)
# into frozen dataclasses — correct at runtime, opaque to mypy's kwarg
# inference. Scoped, documented relaxation.
[[tool.mypy.overrides]]
module = "vigil.providers.synthetic.universe"
disable_error_code = ["call-arg", "arg-type"]
