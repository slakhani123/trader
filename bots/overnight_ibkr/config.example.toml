# Overnight bot configuration. Copy to config.toml and edit.
# All order sizing is WHOLE SHARES (auction orders exclude fractionals).

[bot]
# IB Gateway: live = 4001, paper = 4002. TWS: live = 7496, paper = 7497.
host = "127.0.0.1"
port = 4001
client_id = 17
# leave empty to use the first managed account on the connection
account = ""
journal_path = "overnight.sqlite"
dry_run = false
# refuse to buy when the account already holds the symbol outside the
# journal (crash orphan, or your own separate holdings). Set false ONLY
# if you deliberately hold these tickers alongside the bot.
expect_flat = true
# if one share costs more than clip_usd, still buy 1 share...
round_up_to_one_share = true
# ...but never if the share price exceeds clip_usd * this factor
max_clip_overshoot = 1.6
# minutes past the close to wait for the MOC fill before giving up
fill_wait_minutes = 12
# optional: POST alerts to this URL (e.g. https://ntfy.sh/your-topic)
notify_url = ""

# Chosen pilot config (Sep 2026): the fee-optimal 2-leg basket. IBKR's
# per-order minimums are a flat ~$188/yr PER NAME, so fewer, fatter legs
# beat many thin ones - each leg needs >= ~$450/night just to break even.
# AMD and TSM carry the most statistically robust overnight tilts in the
# study (t = 3.8 / 4.8, 2018-2026). ~$2,700 deployed nightly; at the
# historical pace: gross ~$1,200/yr, fees ~$380/yr, net ~+$830/yr.
# Scaling rule: add a leg only per +$1,200-1,500/night of extra capital
# (candidates: MRVL, MU, AVGO - see research/overnight_intraday/).
[[symbols]]
symbol = "AMD"
clip_usd = 1450        # ~3 shares at $478
max_shares = 3

[[symbols]]
symbol = "TSM"
clip_usd = 1300        # ~3 shares at $429
max_shares = 3

[kill]
# Pre-registered stop conditions, checked before every buy and at every
# reconcile. A trip sets HALTED; clear it manually with `resume`.
enabled = true
# halt when cumulative P&L drawdown exceeds this % of avg nightly notional
max_drawdown_pct = 25.0
max_consecutive_losses = 15
# halt when the trailing window's summed P&L is negative...
trailing_window_nights = 252
# ...once at least this many nights have accumulated
trailing_min_nights = 126
