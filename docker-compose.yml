# Vigil local stack: PostgreSQL + API + frontend.
# NOTE: verified configuration, but the build sandbox used for development had
# no Docker daemon — see docs/LIMITATIONS.md. The same code runs on SQLite
# with zero services: `vigil seed && vigil scan && vigil serve`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vigil
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - vigil_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      VIGIL_DATABASE_URL: postgresql+psycopg://vigil:${POSTGRES_PASSWORD:?}@db:5432/vigil
      VIGIL_API_TOKEN: ${VIGIL_API_TOKEN:?set in .env}
      VIGIL_CORS_ORIGINS: '["http://localhost:5173"]'
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m uvicorn vigil.api.app:create_app --factory --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import httpx; httpx.get(\"http://localhost:8000/api/health\").raise_for_status()'"]
      interval: 10s
      timeout: 5s
      retries: 12

  scheduler:
    build:
      context: ./backend
    environment:
      VIGIL_DATABASE_URL: postgresql+psycopg://vigil:${POSTGRES_PASSWORD:?}@db:5432/vigil
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "vigil.cli", "schedule"]

  web:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  vigil_pgdata:
